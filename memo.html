
<!-- ======================= 当日シート (staff event-night sheet) ======================= -->
<div class="memo" id="memo" role="dialog" aria-modal="true" aria-labelledby="memo-title" lang="ja" hidden>
  <header class="memo-bar">
    <button class="btn" id="memo-back" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">1Fマップ</span></button>
    <h2 class="memo-h" id="memo-title">当日シート<small>アルバイト用・A4 1枚</small></h2>
    <div class="memo-acts">
      <span class="memo-confirm" id="memo-confirm" hidden><span>すべて初期値に戻しますか？</span><button class="btn danger" id="memo-reset-yes" type="button">戻す</button><button class="btn" id="memo-reset-no" type="button">やめる</button></span>
      <button class="btn" id="memo-reset" type="button" title="初期値に戻す / Reset"><svg class="i" viewBox="0 0 24 24"><path d="M4 4v6h6"/><path d="M5 15a8 8 0 1 0 1-7l-2 2"/></svg><span class="lbl">初期値に戻す</span></button>
      <button class="btn" id="memo-copy" type="button" title="テキストをコピー / Copy as text"><svg class="i" viewBox="0 0 24 24"><path d="M8 8h12v12H8z"/><path d="M4 16V4h12"/></svg><span class="lbl">テキストをコピー</span></button>
      <button class="btn primary" id="memo-print" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-8h16v8h-3M7 14h10v7H7z"/></svg><span class="lbl">印刷</span></button>
    </div>
  </header>
  <div class="memo-tabs" role="tablist">
    <button type="button" role="tab" id="memo-tab-form" aria-selected="true" data-tab="form">入力</button>
    <button type="button" role="tab" id="memo-tab-prev" aria-selected="false" data-tab="prev">プレビュー</button>
  </div>
  <div class="memo-body" id="memo-body" data-tab="form">
    <form class="memo-form" id="memo-form" autocomplete="off" onsubmit="return false"></form>
    <section class="memo-prev" id="memo-prev" aria-label="印刷プレビュー">
      <div class="memo-scaler" id="memo-scaler"></div>
      <p class="memo-prev-note">このまま A4 1枚に印刷されます。空欄は手書き用の線になります。</p>
    </section>
  </div>
  <div class="memo-copybox" id="memo-copybox" hidden>
    <p>自動でコピーできませんでした。下のテキストを選択してコピーしてください。</p>
    <textarea id="memo-copy-text" readonly></textarea>
    <div class="btn-row"><button class="btn" id="memo-copy-close" type="button">閉じる</button></div>
  </div>
</div>
